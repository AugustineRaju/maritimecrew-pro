content:space-between;align-items:center;margin-bottom:22px}h1{font-size:27px;margin:0 0 5px}h2{font-size:17px;margin:0}p{margin:0;color:#50617b}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:18px 12px;border-radius:11px;display:flex;align-items:center;gap:13px;min-height:105px}.stat .ico{font-size:30px}.stat strong{font-size:29px;display:block}.stat small{font-size:12px}.blue{background:#e0efff}.green{background:#e1f7e9}.yellow{background:#fff4d7}.red{background:#fde8eb}.mint{background:#e5f7e9}.layout{display:grid;grid-template-columns:1.12fr 1fr 285px;gap:14px}.panel{background:#fff;border:1px solid #d8e1ee;border-radius:12px;box-shadow:0 2px 5px #193b6210;overflow:hidden;margin-bottom:14px}.panel h2{padding:16px;border-bottom:1px solid #e0e8f1;display:flex;justify-content:space-between;align-items:center}.panel h2 a{font-size:12px;color:#1460cf;cursor:pointer}.pad{padding:14px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{background:#edf2f9;color:#24344c}td,th{padding:10px 8px;border-bottom:1px solid #e5edf5}td:first-child{font-weight:600}.pill{padding:6px 9px;border-radius:8px;display:inline-block;font-weight:700}.expired{background:#ffdce1;color:#c62c3e}.warning{background:#fff0c1;color:#9d5a00}.valid{background:#dff6e6;color:#08763e}.brief{background:#f2efff;border-radius:9px;padding:14px;line-height:2}.brief b{font-size:16px}.actions{display:flex;gap:10px;margin-top:12px}.actions button,.primary{padding:11px 14px;border-radius:7px;border:1px solid #b9cbe6;background:white;color:#17418a;cursor:pointer;font-weight:700}.actions .primary,.primary{background:#5d31ce;color:#fff;border-color:#5d31ce}.events>div{padding:13px;border-bottom:1px solid #e7edf5}.events small{display:block;color:#50617b;margin:5px 0 0 20px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(#00b875 0 92%,#d7dee6 92%);margin:20px auto;display:grid;place-items:center}.donut>div /* Responsive layout and safe scrolling */

</style></head><body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileMenu()"></div><aside class="sidebar" id="sidebar"><div class="brand"><span class="ship">⛴</span><div><b>MaritimeCrew Pro</b><small>Crew & Compliance Management</small></div></div><nav id="nav"></nav><div class="sea"><span>🚢</span></div><small class="version">v1.0.0</small></aside>
<div class="main"><header><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false" onclick="toggleMobileMenu()">☰</button><button class="company">🚢 &nbsp; OceanLink Shipping Ltd.⌄</button><input id="search" placeholder="⌕  Search crew, vessel, document..."><span class="headicons">ⓘ　🔔<sup>14</sup></span><div class="avatar">JM</div><b>John Mathew <small>Fleet Manager</small></b></header><section id="content"></section><div class="build-stamp">Mobile layout v4 • 05 Nov 2026</div></div>
<script>const menu=[["▦","Dashboard"],["♟","Crew"],["⛴","Vessels"],["▤","Documents & Certificates"],["⬡","Compliance & Regulations"],["▣","Assignments & Joinings"],["☷","Inspections & Audits"],["▥","Reports"],["♧","Alerts & Reminders"],["⚙","Administration"]];
const crew=[{name:"John Mathew",rank:"Chief Engineer",doc:"Medical Fitness",expiry:"24 Jan 2027",status:"Expired",vessel:"MV Ocean Star"},{name:"David Thomas",rank:"2nd Officer",doc:"STCW (Basic Safety)",expiry:"07 Feb 2027",status:"12 days",vessel:"MV Horizon"},{name:"Alex George",rank:"AB",doc:"Passport",expiry:"15 Mar 2027",status:"Valid",vessel:"MV Atlantic"},{name:"Rohit Kumar",rank:"ETO",doc:"GMDSS Certificate",expiry:"10 Feb 2027",status:"15 days",vessel:"MV Coral"},{name:"Stephen Allen",rank:"Chief Officer",doc:"Visa (USA)",expiry:"28 Jan 2027",status:"2 days",vessel:"MV Ocean Star"}];
const vessels=[{name:"MV Ocean Star",imo:"9876543",flag:"🇮🇪 IRL",crew:24,rate:96,issues:0},{name:"MV Horizon",imo:"9765432",flag:"🇲🇹 MLT",crew:26,rate:92,issues:2},{name:"MV Atlantic",imo:"9654321",flag:"🇵🇦 PAN",crew:23,rate:88,issues:3},{name:"MV Coral",imo:"9543210",flag:"🇱🇷 LBR",crew:25,rate:94,issues:0}];
let current="Dashboard";const el=document.getElementById("content");
function nav(){document.getElementById("nav").innerHTML=menu.map(([icon,label])=>`<button class="${current===label?'active':''}" onclick="page('${label.replaceAll("'","\\'")}')"><span class="navicon">${icon}</span><span class="navlabel">${label}</span></button>`).join("")}
const pill=s=>`<span class="pill ${s==='Expired'?'expired':s==='Valid'?'valid':'warning'}">${s}</span>`;
function crewTable(rows=crew){return `<table><thead><tr><th>Crew Member</th><th>Rank</th><th>Document</th><th>Expiry</th><th>Status</th></tr></thead><tbody>${rows.map(c=>`<tr class="click" onclick="detail('${c.name}')"><td>👤 ${c.name}</td><td>${c.rank}</td><td>${c.doc}</td><td>${c.expiry}</td><td>${pill(c.status)}</td></tr>`).join("")}</tbody></table>`}
function vesselTable(){return `<table><thead><tr><th>Vessel</th><th>Flag</th><th>Crew</th><th>Compliance</th><th>Issues</th></tr></thead><tbody>${vessels.map(v=>`<tr class="click" onclick="detail('${v.name}')"><td>🚢 ${v.name}<br><small>IMO ${v.imo}</small></td><td>${v.flag}</td><td>${v.crew}</td><td><b style="color:#13824d">${v.rate}%</b><div class="progress"><span style="width:${v.rate}%"></span></div></td><td>${v.issues?pill(v.issues+' issues'):'0'}</td></tr>`).join("")}</tbody></table>`}
function panel(title,body,link='',action=''){return `<div class="panel"><h2>${title}${link?`<a onclick="page('${action}')">${link} →</a>`:''}</h2>${body}</div>`}
function dashboard(){return `<div class="pageheading"><div><h1>Fleet Compliance Dashboard</h1><p>Crew, vessel documents and regulatory compliance at a glance</p></div><span>As of 26 Jan 2027, 10:24 UTC &nbsp; <button onclick="page('Dashboard')">⟳</button></span></div><div class="stats">${[['⛴','8','Active Vessels','blue'],['♟','186','Crew Members','green'],['⚠','14','Documents Expiring (next 30 days)','yellow'],['⊗','5','Non-Compliant (action required)','red'],['⬡','92%','Compliance Rate','mint']].map(([i,v,l,c])=>`<div class="stat ${c}"><span class="ico">${i}</span><div><strong>${v}</strong><small>${l}</small></div></div>`).join('')}</div><div class="layout"><div>${panel('⬡ &nbsp; Crew Document Alerts',crewTable(),'View All (14)','Documents & Certificates')}${panel('⛴ &nbsp; Vessel Compliance Status',vesselTable(),'View Fleet','Vessels')}</div><div>${panel('✦ &nbsp; AI Compliance Assistant',`<div class="pad"><div class="brief"><b>Daily Briefing – 26 Jan 2027</b><br>🔴 1 document has expired (Medical – John Mathew).<br>🟡 4 documents will expire within 15 days.<br>🔵 2 crew members are missing required documents for their next joining.<br>🟢 Fleet compliance rate is <b>92%</b> (▲ +1% from last week).</div><div class="actions"><button class="primary" onclick="page('Alerts & Reminders')">View Actions (5)</button><button onclick="report()">▤ Generate Report</button></div></div>`)}${panel('▤ &nbsp; Document Readiness – Next 30 Days',`<div class="pad">${[['Medical Fitness',181],['STCW Certificates',182],['Passports',184],['Visas',185],['Other Certificates',184]].map(([l,n])=>`<div class="barrow"><span>${l}</span><div class="bar"><em></em><b>${n}</b></div></div>`).join('')}<small>🟥 Expired (1)　🟨 Expiring (14)　🟩 Valid (553)</small></div>`)}</div><div class="right">${panel('▣ &nbsp; Upcoming Events',`<div class="events"><div>🟦 Vessel Inspection – MV Ocean Star<small>05 Feb 2027</small></div><div>🟧 ISM Audit – MV Horizon<small>12 Feb 2027</small></div><div>🟩 Crew Joining – 6 Crew<small>14 Feb 2027</small></div><div class="click" onclick="page('Assignments & Joinings')">View Calendar →</div></div>`)}${panel('◉ &nbsp; Compliance by Area',`<div class="donut"><div><strong>92%</strong><span>Compliant</span></div></div><div class="legend">${[['Crew Certificates','94%'],['Vessel Documents','91%'],['Training (STCW)','90%'],['Inspections/Audits','88%']].map(([k,v])=>`<div><span>🟢 ${k}</span><b>${v}</b></div>`).join('')}</div>`)}</div></div>`}
function generic(){let data='',title=current;if(current==='Crew')data=crewTable();else if(current==='Vessels')data=vesselTable();else if(current==='Documents & Certificates')data=crewTable();else if(current==='Compliance & Regulations')data=`<div class="notice">Compliance overview: 92% fleet readiness. Five open issues require review.</div>${vesselTable()}`;else if(current==='Assignments & Joinings')data=`<table><tr><th>Date</th><th>Event</th><th>Vessel</th></tr><tr><td>14 Feb 2027</td><td>6 crew joining</td><td>MV Ocean Star</td></tr><tr><td>21 Feb 2027</td><td>4 crew joining</td><td>MV Horizon</td></tr></table>`;else if(current==='Inspections & Audits')data=`<table><tr><th>Date</th><th>Inspection</th><th>Vessel</th></tr><tr><td>05 Feb 2027</td><td>Vessel Inspection</td><td>MV Ocean Star</td></tr><tr><td>12 Feb 2027</td><td>ISM Audit</td><td>MV Horizon</td></tr></table>`;else if(current==='Reports')data=`<p>Generate a static fleet compliance report using the button below.</p><br><button class="primary" onclick="report()">Generate Report</button>`;else if(current==='Alerts & Reminders')data=crewTable(crew.filter(c=>c.status!=='Valid'));else data=`<p>OceanLink Shipping Ltd. — Demo account</p><br><label>Reminder threshold (days): <input type="number" value="30"></label><br><br><button class="primary" onclick="alert('Demo settings saved locally for this session.')">Save Settings</button>`;return `<div class="toolbar"><div><h1>${title}</h1><p>OceanLink Shipping Ltd. · Demonstration data</p></div><input id="filter" placeholder="Search this screen..." oninput="filterRows(this.value)"></div>${panel(title,`<div class="pad full">${data}</div>`)}`}
function filterRows(q){document.querySelectorAll('#content tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function closeMobileMenu(){document.body.classList.remove('menu-open');document.getElementById('menuToggle').setAttribute('aria-expanded','false')}
function toggleMobileMenu(){const open=document.body.classList.toggle('menu-open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(open))}
function page(name){current=name;nav();el.innerHTML=name==='Dashboard'?dashboard():generic();el.querySelectorAll('table').forEach(t=>{const wrapper=document.createElement('div');wrapper.className='table-scroll';t.parentNode.insertBefore(wrapper,t);wrapper.appendChild(t)});closeMobileMenu();window.scrollTo(0,0)}
function detail(name){alert(`${name}\n\nThis is a demo record. In the full product, this opens the crew or vessel detail page.`)}
function report(){const lines=['MaritimeCrew Pro - Fleet Compliance Report','Demo data - 26 Jan 2027','Fleet compliance: 92%','Active vessels: 8','Crew members: 186','Documents expiring: 14','Non-compliant: 5','',...crew.map(c=>`${c.name}, ${c.doc}, ${c.expiry}, ${c.status}`)];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='fleet-compliance-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.getElementById('search').addEventListener('input',e=>{if(current==='Dashboard'&&e.target.value.trim())page('Crew');filterRows(e.target.value)});page('Dashboard');</script></body></html>
